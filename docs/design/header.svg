<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Хакатон Нефтекод" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- ПАЛИТРА: чёрный 050A0F · 153A4E · 246487 · 338EBF · 42B6F5
         Три стопа перетекают по кругу за 12 секунд.
         Ось градиента медленно вращается — цвет идёт по диагонали. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050A0F">
        <animate attributeName="stop-color" values="#050A0F;#153A4E;#246487;#050A0F" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#246487">
        <animate attributeName="stop-color" values="#246487;#338EBF;#050A0F;#246487" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#42B6F5">
        <animate attributeName="stop-color" values="#42B6F5;#050A0F;#338EBF;#42B6F5" dur="12s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="0 0.5 0.5" to="360 0.5 0.5" dur="30s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Затемняющая вуаль по центру: держит контраст белого текста
         в светлой фазе переливания. Убрать — станет ярче, но хуже читаемо. -->
    <radialGradient id="veil" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0%"   stop-color="#050A0F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" rx="20" fill="url(#g)"/>
  <rect width="900" height="220" rx="20" fill="url(#veil)"/>

  <text x="450" y="120" text-anchor="middle"
        font-family="Inter, Manrope, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="-1" fill="#FFFFFF">Хакатон «Нефтекод»</text>

  <rect x="418" y="146" width="64" height="4" rx="2" fill="#42B6F5"/>
</svg>
