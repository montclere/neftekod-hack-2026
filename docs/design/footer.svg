<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="Команда discipline ml" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Та же палитра и длительность, обратный порядок стопов:
         футер переливается в противофазе с шапкой. -->
    <linearGradient id="fg" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#42B6F5">
        <animate attributeName="stop-color" values="#42B6F5;#050A0F;#338EBF;#42B6F5" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#246487">
        <animate attributeName="stop-color" values="#246487;#338EBF;#050A0F;#246487" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#050A0F">
        <animate attributeName="stop-color" values="#050A0F;#153A4E;#246487;#050A0F" dur="12s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="360 0.5 0.5" to="0 0.5 0.5" dur="30s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="fveil" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0%"   stop-color="#050A0F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="110" rx="20" fill="url(#fg)"/>
  <rect width="900" height="110" rx="20" fill="url(#fveil)"/>

  <rect x="418" y="34" width="64" height="3" rx="1.5" fill="#42B6F5"/>

  <text x="450" y="76" text-anchor="middle"
        font-family="Inter, Manrope, SF Pro Display, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="28" font-weight="600" letter-spacing="-0.5" fill="#FFFFFF">Команда discipline ml</text>
</svg>
