<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- B1 — СВЕЧЕНИЕ СБОКУ. Базовый фон презентации.
         Растяжка от заданного 42B6F5:
         97D7FA · 6CC6F7 · 42B6F5 · 338EBF · 246487 · 153A4E · 050A0F
         Свечение справа — там встанет объект и выйдет из света.
         Второе пятно слева внизу убирает ощущение одного источника. -->
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#42B6F5" stop-opacity="0.60"/>
      <stop offset="50%" stop-color="#338EBF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#153A4E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#246487" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#246487" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#050A0F"/>
  <ellipse cx="1440" cy="440"  rx="880" ry="720" fill="url(#g1)"/>
  <ellipse cx="620"  cy="1030" rx="760" ry="450" fill="url(#g2)"/>
</svg>
