<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-label="Footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Та же палитра и длительность, обратный порядок стопов:
         футер переливается в противофазе с шапкой. -->
    <linearGradient id="fg" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#DB2777">
        <animate attributeName="stop-color" values="#DB2777;#4F46E5;#7C3AED;#DB2777" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#DB2777;#4F46E5;#7C3AED" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#7C3AED;#DB2777;#4F46E5" dur="12s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="360 0.5 0.5" to="0 0.5 0.5" dur="30s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="900" height="130" rx="20" fill="url(#fg)"/>

  <text x="60" y="58" font-family="Inter,SF Pro Display,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Команда НАЗВАНИЕ</text>

  <text x="60" y="86" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="14" fill="#FFFFFF" fill-opacity="0.75">Собрано за 48 часов на «Название хакатона»</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12"
     fill="#FFFFFF" fill-opacity="0.85" text-anchor="end">
    <text x="840" y="56">демо → example.com</text>
    <text x="840" y="80">видео → youtu.be/xxxx</text>
  </g>
</svg>
