<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Header" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- ═══ ПАЛИТРА ═══
         Три стопа перетекают по кругу. Меняете девять значений цвета ниже.
         dur=12s — спокойно, 6s — заметно, 20s — почти незаметно. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#7C3AED;#DB2777;#4F46E5" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#DB2777;#4F46E5;#7C3AED" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#DB2777">
        <animate attributeName="stop-color" values="#DB2777;#4F46E5;#7C3AED;#DB2777" dur="12s" repeatCount="indefinite"/>
      </stop>
      <!-- Поворот оси: цвета перетекают по диагонали, а не просто меняются -->
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="0 0.5 0.5" to="360 0.5 0.5" dur="30s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="900" height="270" rx="20" fill="url(#g)"/>

  <!-- ТРЕК -->
  <rect x="60" y="40" width="196" height="26" rx="13" fill="#fff" fill-opacity="0.16"/>
  <text x="76" y="57" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11"
        fill="#FFFFFF" fill-opacity="0.9" letter-spacing="1.4">ХАКАТОН · ТРЕК</text>

  <!-- НАЗВАНИЕ -->
  <text x="60" y="126" font-family="Inter,SF Pro Display,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="-2">НАЗВАНИЕ</text>

  <!-- ТЕГЛАЙН -->
  <text x="60" y="158" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="16" fill="#FFFFFF" fill-opacity="0.78">Одна строка: что делает и для кого</text>

  <!-- ═══ БЕГУЩИЙ ПИТЧ: боль → решение → эффект ═══
       Три строки сменяют друг друга. Цикл 10.5 сек, по 3.5 сек на строку.
       Правится прямо здесь, никакого percent-encoding — обычный текст. -->
  <rect x="60" y="196" width="3" height="34" rx="1.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#FFFFFF" fill-opacity="0.92">
    <text x="78" y="218" opacity="0">Оператор тратит 40 секунд на одно обращение
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.29;0.33"
               dur="10.5s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="78" y="218" opacity="0">Мы находим дубль за 0.2 секунды
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.29;0.33"
               dur="10.5s" begin="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="78" y="218" opacity="0">1400 часов в год возвращаются бизнесу
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.29;0.33"
               dur="10.5s" begin="7s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
